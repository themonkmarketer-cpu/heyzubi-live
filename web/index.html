<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>HeyZubi</title>
    <!-- The saved theme, applied before the app loads so the first paint is already right (configStore.ts THEMES). -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('heyzubi.theme') || localStorage.getItem('bothq.theme') || localStorage.getItem('grokbot.theme'); } catch (e) {}
        var map = { dark: ['dark'], midnight: ['dark', 'midnight', 1], forest: ['dark', 'forest', 1], sandstone: ['light', 'sandstone', 1], silver: ['light', 'silver', 1] };
        var d = map[t] || map.dark;
        var r = document.documentElement;
        r.setAttribute('data-theme', d[0]);
        if (d[1]) r.setAttribute('data-palette', d[1]);
        if (d[2]) r.setAttribute('data-look', 'refresh');
        r.style.colorScheme = d[0];
      })();
    </script>
    <style>
      html { background: #FAF9FC; } html[data-theme='dark'] { background: #0F0D14; }
      html[data-palette='midnight'] { background: #081422; } html[data-palette='forest'] { background: #051F20; }
      html[data-palette='sandstone'] { background: #F4F1EA; } html[data-palette='silver'] { background: #F3F3F3; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
